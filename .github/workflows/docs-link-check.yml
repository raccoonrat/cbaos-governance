name: docs-link-check

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-doc-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check relative markdown links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".").resolve()
          md_files = [p for p in root.rglob("*.md") if ".git" not in p.parts]

          # Matches [text](target)
          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          failed = False
          for md in md_files:
            text = md.read_text(encoding="utf-8", errors="ignore")
            for m in link_re.finditer(text):
              target = m.group(1).strip()

              # drop optional title: (path "title")
              if " " in target and not target.startswith(("http://", "https://")):
                target = target.split(" ", 1)[0].strip()

              # strip anchor
              target = target.split("#", 1)[0].strip()
              if not target:
                continue

              if target.startswith(("#", "http://", "https://", "mailto:", "{{")):
                continue

              resolved = (md.parent / target).resolve()
              try:
                resolved.relative_to(root)
              except Exception:
                # ignore links escaping repo (treat as external)
                continue

              if not resolved.exists():
                print(f"Broken relative link in {md.relative_to(root)} -> {m.group(1)}")
                failed = True

          if failed:
            sys.exit(1)
          PY

      - name: Check basic URL shape in markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          url_re = re.compile(r"https?://[^\s)\]]+")
          md_files = [p for p in Path(".").rglob("*.md") if ".git" not in p.parts]

          bad = False
          for md in md_files:
            text = md.read_text(encoding="utf-8", errors="ignore")
            for url in url_re.findall(text):
              if " " in url:
                print(f"Malformed URL (contains space) in {md}: {url}")
                bad = True
              if url.endswith(("(", "[", "{")):
                print(f"Suspicious URL ending in {md}: {url}")
                bad = True

          if bad:
            sys.exit(1)
          PY

      - name: Check required navigation references
        shell: bash
        run: |
          set -euo pipefail
          # Ensure core docs exist (docs-link-check shouldn't pass on a hollow repo).
          required_refs=(
            "CHARTER/program_charter.md"
            "ORG/org_structure.md"
            "REPO_POLICY/repo_policy.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
          )

          for f in "${required_refs[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing expected doc: $f"
              exit 1
            fi
          done

      - name: Summary
        run: echo "Documentation link checks passed."

