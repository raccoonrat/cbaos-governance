name: 缺陷报告
description: 报告文档错误、链接失效或治理流程中的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现路径或期望行为。
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 一句话说明问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 相关路径或链接
      placeholder: 例如 CHARTER/glossary.md 第 3 行
    validations:
      required: true
